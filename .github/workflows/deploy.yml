name: Update gist Version

on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/DemoFx.exe
            target/java-fx-demo-0.0.1-SNAPSHOT.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Gist Version
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          NEW_VERSION: ${{ github.ref_name }}
        run: |
          NEW_JSON='[
          { 
            "type" : "save",
            "name" : "DemoFx.exe",
            "path" : ".",
            "url" : "https://github.com/${{ github.repository }}/releases/download/'"$NEW_VERSION"'/DemoFx.exe"
          },
          {
            "type" : "save",
            "name": "java-fx-demo-0.0.1-SNAPSHOT.jar",
            "path": ".",
            "url": "https://github.com/${{ github.repository }}/releases/download/'"$NEW_VERSION"'/java-fx-demo-0.0.1-SNAPSHOT.jar"
         }
         ]'
          
         curl -L \
           -X PATCH \
           -H "Accept: application/vnd.github+json" \
           -H "Authorization: Bearer $GIST_TOKEN" \
           -H "X-GitHub-Api-Version: 2022-11-28" \
           https://api.github.com/gists/$GIST_ID \
           -d "{\"files\":{\"config.json\":{\"content\": $(echo $NEW_JSON | jq -R .) }}}"